name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice
        shell: pwsh
        run: |
          winget install --id TheDocumentFoundation.LibreOffice --exact --silent --accept-source-agreements --accept-package-agreements
          $office = Join-Path $env:ProgramFiles "LibreOffice"
          if (!(Test-Path "$office\program\soffice.exe")) { throw "LibreOffice non trovato" }
          "LIBREOFFICE_DIR=$office" >> $env:GITHUB_ENV
      - name: Build application
        run: |
          python -m pip install pyinstaller
          pyinstaller --noconfirm --clean --windowed --onedir --name FogliInPDF converter_excel_pdf.py
      - name: Bundle LibreOffice and create installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist\FogliInPDF\LibreOffice" | Out-Null
          Copy-Item "$env:LIBREOFFICE_DIR\*" "dist\FogliInPDF\LibreOffice" -Recurse -Force
          choco install innosetup --yes --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/installer/FogliInPDF-Setup-Windows.exe
          if-no-files-found: error

  macos:
    name: macOS installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice and DMG tool
        run: |
          brew install --cask libreoffice
          brew install create-dmg
      - name: Build application
        run: |
          python3 -m pip install pyinstaller
          pyinstaller --noconfirm --clean --windowed --name "Fogli in PDF" converter_excel_pdf.py
          mkdir -p "dist/Fogli in PDF.app/Contents/Resources"
          ditto /Applications/LibreOffice.app "dist/Fogli in PDF.app/Contents/Resources/LibreOffice.app"
      - name: Create DMG
        run: |
          create-dmg \
            --volname "Fogli in PDF" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 170 \
            "dist/FogliInPDF-Setup-macOS.dmg" \
            "dist/Fogli in PDF.app"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/FogliInPDF-Setup-macOS.dmg
          if-no-files-found: error

  release:
    name: Publish installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*